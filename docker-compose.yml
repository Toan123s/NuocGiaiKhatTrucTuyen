# TV1: hoàn thiện Dockerfile web/api và Compose chạy đủ 3 dịch vụ local; DB hiện đã chạy được.
# Phối hợp TV3 về env/kết nối; bàn giao cấu hình image/cổng/health cho TV6 làm CD và production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-brewlite}
      POSTGRES_USER: ${DB_USER:-brewlite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Hay copy .env_vidu thanh .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - brewlite_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  brewlite_data:
