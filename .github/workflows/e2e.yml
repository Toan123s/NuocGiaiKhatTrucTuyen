# TV6 — E2E Playwright chạy trên stack Docker (docker compose của TV1). Chạy tay: Actions → E2E → Run workflow.
# Điều kiện: đã chạy `npm i -D @playwright/test` và commit package.json + package-lock.json.
# Secret trong job là giá trị ngẫu nhiên tạo ngay lúc chạy, không dùng secret thật của nhóm.
name: E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tạo .env tạm cho CI (giá trị ngẫu nhiên)
        run: |
          DB_PASS="$(openssl rand -hex 16)"
          JWT="$(openssl rand -hex 32)"
          SEPAY="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$JWT"
          echo "::add-mask::$SEPAY"
          cp .env_vidu .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$DB_PASS|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT|" .env
          sed -i "s|^SEPAY_WEBHOOK_API_KEY=.*|SEPAY_WEBHOOK_API_KEY=$SEPAY|" .env
          echo "SEPAY_WEBHOOK_API_KEY=$SEPAY" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Database sạch, migrate và seed
        run: |
          docker compose up -d --wait db
          npm run db:migrate
          npm run db:seed
          npm run db:migrate
      - name: Chạy web + API bằng Docker
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: Kiểm tra health
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:4000/health
      - run: npx playwright install --with-deps chromium
      - name: Chạy E2E
        env:
          E2E_WEB_URL: http://localhost:3000
          E2E_API_URL: http://localhost:4000
        run: npx playwright test
      - name: Lưu báo cáo khi lỗi
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
      - name: Log container khi lỗi
        if: ${{ failure() }}
        run: docker compose logs --tail=200
      - name: Dọn dẹp
        if: ${{ always() }}
        run: docker compose down -v
