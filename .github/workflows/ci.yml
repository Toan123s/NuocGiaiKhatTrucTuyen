name: Check scaffold
on:
  pull_request:
  push:
    branches: [main, scaffold/brewlite-customer]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
# TV3 TODO: thêm ESLint quality gate; giữ npm ci → typecheck/lint → test → build trên PR.
# TV3 cấu hình required checks/branch protection với chủ repo; báo TV6 tên job để ghép CD.
# TV6 TODO: CD image/registry/deploy/smoke/rollback sau khi chốt hosting, dùng image/Compose do TV1 bàn giao.
# Branch protection cần cấu hình trong GitHub, workflow này tự nó không chặn quyền merge.
